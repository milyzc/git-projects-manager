# git-projects manifest: the git repositories of this machine, grouped by arbitrary sections
# (work, personal, university...). THIS FILE IS A TEMPLATE: install.sh / `git projects init`
# copy it to ~/.config/git-projects/projects.yml (outside the repository). Override the
# location with $GIT_PROJECTS_FILE or --file.
#
# Fields per project:
#   path:    where the repository lives locally (~ is expanded). Required.
#   remote:  URL to clone from, ssh or https, written exactly as git expects it. Either a single
#            URL (becomes `origin`) or a mapping of named remotes; `origin` is cloned, the rest
#            are added with `git remote add`.
#   branch:  branch to check out on clone (optional, `-b`).
#   submodules: true | false (default). true clones with --recurse-submodules and, on a repo that
#            already exists, runs `git submodule update --init --recursive` if any is missing.
#   status:  active (default) | paused | archived. `clone` skips archived unless --status says otherwise.
#   user:    name / email written to the repo's local git config (and each submodule's) on clone,
#            so commits do not ask for an identity. Optional; either key may be omitted.
#   notes:   short description (optional).
# Section defaults: a `defaults:` entry inside a section is not a project; its `user:` applies to
# every project of the section, and a project's own `user:` overrides it key by key.
# Unknown keys (e.g. ai-memory's `agents:` / `memory:`) are ignored, so this file can be shared.
#
# NEVER put credentials here: no https://user:token@..., no ?token= in URLs. `git projects check`
# rejects them. https authenticates through the git credential helper (osxkeychain, gh auth),
# ssh through your keys / agent.

